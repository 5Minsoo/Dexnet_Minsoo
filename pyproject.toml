[project]
name = "Minsoo-net"
version = "0.1.0"
description = "Autonomous Manufacturing & Grasping Project"
readme = "README.md"
requires-python = "==3.10"
dependencies = [
    "cvxopt==1.3.3",
    "matplotlib==3.6.3",
    "numpy==1.26.4",
    "opencv-python==4.8.1.78",
    "pyrealsense2==2.57.7.10387",
    "pyrender==0.1.45",
    "pysdf==0.1.9",
    "python-fcl==0.7.0.10",
    "pyyaml==6.0.3",     
    "sapien==3.0.3",
    "scipy>=1.8.0, <1.11.0",
    "trimesh==4.11.3",
    "torch",
    "scikit-learn>=1.5.0, <1.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Minsoo_net"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
# torchvision = { index = "pytorch-cu128" }
# torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "ipython==8.12.3",
]
dataset = [
    "zarr>=3.0; python_version >= '3.12'",
    "pyhull==2015.2.1",
    "tensorflow"
]
